services:
  db:
    image: postgres:16-alpine
    container_name: scholartrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholartrack
      POSTGRES_PASSWORD: scholartrack
      POSTGRES_DB: scholartrack
    ports:
      - '5432:5432'
    volumes:
      - scholartrack-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scholartrack -d scholartrack']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: scholartrack-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Note: "db" est le nom du service Docker, pas localhost
      DATABASE_URL: postgresql://scholartrack:scholartrack@db:5432/scholartrack?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
      BETTER_AUTH_URL: http://localhost:3000
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_MS: 60000
      AT_RISK_THRESHOLD: 0.20
      PORT: 3000
      NODE_ENV: development
    volumes:
      # Bind mount du code source pour hot reload
      - .:/app
      # Volume anonyme pour "protéger" node_modules du host
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  scholartrack-data:
